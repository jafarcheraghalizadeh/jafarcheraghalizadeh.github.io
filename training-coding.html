<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Training & coding — Jafar Cheraghalizadeh</title><style>
*{box-sizing:border-box}
:root{--ink:#192d30;--muted:#53676a;--accent:#236253;--line:#dce4e2;--paper:#f7f8fa}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}
a{color:inherit}
a:focus-visible{outline:3px solid #b76b2d;outline-offset:5px}
.wrap{width:min(1080px,calc(100% - 48px));margin:auto}
.skip{position:absolute;left:24px;top:-100px;background:var(--ink);color:white;padding:10px;z-index:10}
.skip:focus{top:12px}
nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.15rem;text-decoration:none;letter-spacing:-.04em}
.links{display:flex;gap:28px;flex-wrap:wrap}
.links a{text-decoration:none;font-size:.9rem;color:var(--muted)}
.links a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:6px}
.hero{padding:100px 0 88px;max-width:850px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--accent);margin:0 0 20px}
h1{font-size:clamp(2.8rem,7vw,5.5rem);line-height:1.08;letter-spacing:-.065em;margin:0 0 28px;font-weight:750}
h1 span{color:var(--accent)}
.lead{font-size:1.2rem;color:var(--muted);max-width:560px;margin:0 0 32px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 22px;border-radius:8px;background:var(--accent);color:white;text-decoration:none;font-size:.9rem;font-weight:650;border:1px solid var(--accent)}
.button:hover{background:#184b3f}
.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.button.secondary:hover{background:#e9efed}
section{padding:54px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.8rem,4vw,2.4rem);line-height:1.2;letter-spacing:-.04em;margin:0 0 20px}
.about{display:grid;grid-template-columns:1fr 1.5fr;gap:64px}
.about p{margin:0;font-size:1.12rem;color:var(--muted);max-width:650px}
.section-heading{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-bottom:24px}
.section-heading h2{margin:0}
.section-heading p{color:var(--muted);font-size:.9rem;margin:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:white;padding:28px;border:1px solid var(--line);border-radius:14px}
.number{display:block;color:var(--accent);font-size:.8rem;font-weight:700;margin-bottom:40px}
h3{font-size:1.18rem;letter-spacing:-.02em;margin:0 0 10px;line-height:1.4}
.card p{font-size:.95rem;color:var(--muted);margin:0 0 22px}
.tag{display:inline-block;font-size:.73rem;font-weight:650;padding:4px 10px;border-radius:20px;background:#edf3f0;color:var(--accent)}
.contact{margin:30px 0 64px;background:#eaf1ee;padding:44px;border:1px solid #d6e3dd;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:28px}
.contact h2{margin-bottom:10px}
.contact p{margin:0;color:var(--muted)}
.contact .button{flex-shrink:0}
footer{display:flex;justify-content:space-between;gap:20px;padding:24px 0 32px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
footer p{margin:0}
@media(max-width:700px){
.wrap{width:calc(100% - 36px)}
nav{padding:22px 0;align-items:flex-start}.links{gap:16px}
.hero{padding:64px 0 60px}.lead{font-size:1.08rem}
.about{grid-template-columns:1fr;gap:10px}
section{padding:36px 0}.section-heading{display:block}.section-heading p{margin-top:10px}
.cards{grid-template-columns:1fr}.number{margin-bottom:22px}
.contact{padding:28px;display:block;margin-bottom:40px}.contact .button{margin-top:24px}
footer{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Decorative motion stays behind the content and never blocks interaction. */
body{background:radial-gradient(ellipse at 95% 10%,#e2eee7 0,transparent 42%),var(--paper)}
.hero{position:relative;isolation:isolate}
.hero::after{content:"";position:absolute;width:clamp(130px,24vw,280px);aspect-ratio:1;right:-8%;top:16%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#deebdf,#accdc1);opacity:.45;z-index:-1;animation:float-orb 10s ease-in-out infinite;pointer-events:none}
.hero .eyebrow,.hero h1,.hero .lead,.hero .actions{animation:arrive .8s ease-out both}
.hero h1{animation-delay:.1s}.hero .lead{animation-delay:.2s}.hero .actions{animation-delay:.3s}
.button,.card,.links a{transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease,color .25s ease}
.button:hover{transform:translateY(-3px);box-shadow:0 8px 20px #23625322}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#236253,#8dbda8);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 30px #192d3010}
.card:hover::before{transform:scaleX(1)}
.contact{background:linear-gradient(120deg,#eaf1ee,#dfece4)}
@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes float-orb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(18px) scale(1.06)}}
@media(max-width:700px){.hero::after{right:0;top:8%;opacity:.3}}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition:none!important}
.button:hover,.card:hover{transform:none}
}

.profile-photo{display:block;width:160px;height:160px;object-fit:cover;object-position:center;border-radius:50%;margin-bottom:28px;border:5px solid white;box-shadow:0 12px 32px #192d3018}
@media(max-width:700px){.profile-photo{width:128px;height:128px}}

/* Use the existing right-hand circle for the portrait. */
.hero{max-width:none;padding-right:340px;min-height:440px}
.hero::after{display:none}
.profile-photo{position:absolute;right:0;top:100px;width:280px;height:280px;margin:0;border:5px solid white;box-shadow:0 16px 40px #192d3018;animation:float-orb 10s ease-in-out infinite}
@media(max-width:900px) and (min-width:701px){.hero{padding-right:250px}.profile-photo{width:210px;height:210px}}
@media(max-width:700px){.hero{padding-right:0;min-height:0;padding-top:64px}.profile-photo{position:static;width:160px;height:160px;margin:0 0 28px auto}}
@media(prefers-reduced-motion:reduce){.profile-photo{animation:none}}

.page-intro{padding:72px 0 48px;max-width:850px}.page-intro h1{font-size:clamp(2.6rem,7vw,4.8rem)}.page-content{margin-bottom:64px}.page-content p{color:var(--muted)}.links a[aria-current="page"]{color:var(--accent);font-weight:700}@media(max-width:700px){nav{flex-wrap:wrap}.page-intro{padding:48px 0 32px}}
